<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECNOFIT - Registro</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <div class="form-container">
    <!-- Encabezado con Botón al Home e Iniciar Sesión -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <a href="index.html" class="btn-secondary" style="text-decoration: none; font-size: 13px; margin: 0; background-color: #6c757d;">Home</a>
      <h2 style="margin: 0; font-size: 18px;">Registro TECNOFIT</h2>
      <a href="login.html" class="btn-secondary" style="text-decoration: none; font-size: 13px; margin: 0;">Iniciar Sesión</a>
    </div>
    
    <form id="registroForm" novalidate>
      <div class="form-group">
        <label for="nombre">Nombre Completo *</label>
        <input type="text" id="nombre" maxlength="80">
        <span class="error" id="errorNombre"></span>
      </div>

      <div class="form-group">
        <label for="email">Correo Institucional *</label>
        <input type="email" id="email" placeholder="ejemplo@duoc.cl" maxlength="60">
        <span class="error" id="errorEmail"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password">
        <span class="error" id="errorPassword"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña *</label>
        <input type="password" id="confirmPassword">
        <span class="error" id="errorConfirmPassword"></span>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono (Opcional)</label>
        <input type="text" id="telefono" maxlength="9">
        <span class="error" id="errorTelefono"></span>
      </div>

      <div class="section-dispositivos">
        <h3>Dispositivos Vinculados</h3>
        <div id="contenedorDispositivos"></div>
        <button type="button" id="btnAgregarDispositivo" class="btn-secondary">+ Añadir Dispositivo</button>
        <span class="error" id="errorDispositivos"></span>
      </div>

      <button type="submit" class="btn-primary">Registrar Cuenta</button>
    </form>
  </div>

  <script src="tecnofit.js"></script>
</body>
</html>
