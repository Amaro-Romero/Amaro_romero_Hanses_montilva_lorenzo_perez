<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECNOFIT - Iniciar Sesión</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <div class="form-container">
    <h2>Inicio de Sesión - TECNOFIT</h2>
    
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="correoLogin">Correo Institucional *</label>
        <input 
          type="email" 
          id="correoLogin" 
          placeholder="ejemplo@duoc.cl" 
          maxlength="60"
        >
        <span class="error" id="errorCorreoLogin"></span>
      </div>

      <div class="form-group">
        <label for="passwordLogin">Contraseña *</label>
        <input 
          type="password" 
          id="passwordLogin"
          placeholder="Tu contraseña"
        >
        <span class="error" id="errorPasswordLogin"></span>
      </div>

      <button type="submit" class="btn-primary">Iniciar Sesión</button>
    </form>

    <div style="text-align: center; margin-top: 15px; font-size: 14px;">
      <p>¿No tienes una cuenta? <a href="registro.html" style="color: #0056b3; font-weight: bold; text-decoration: none;">Regístrate aquí</a></p>
    </div>
  </div>

  <script src="tecnofit.js"></script>
</body>
</html>
